

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIRTOSIX Logo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: white;
}

.banner {
    width: 100%;
    min-height: 260px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(120deg, #ffffff, #f5fff7, #ffffff);
}

/* Background waves */
.wave-left {
    position: absolute;
    top: 0;
    left: 0;
    width: 350px;
    height: 100%;
    background: linear-gradient(135deg, #00e64d, #006622);
    clip-path: polygon(0 0, 75% 0, 0 60%);
    opacity: 0.9;
}

.wave-right {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 400px;
    height: 100%;
    background: linear-gradient(135deg, #00ff55, #004d19);
    clip-path: polygon(100% 100%, 100% 30%, 40% 100%);
    opacity: 0.9;
}

.wave-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 80px;
    background: linear-gradient(90deg, transparent, #b5ffca, transparent);
    clip-path: polygon(0 100%, 30% 60%, 70% 90%, 100% 20%, 100% 100%);
}

/* Logo */
.logo-container {
    position: relative;
    z-index: 2;
    text-align: center;
}

.logo {
    font-size: clamp(35px, 8vw, 85px);
    font-weight: 900;
    letter-spacing: 12px;
    background: linear-gradient(
        180deg,
        #00e64d,
        #00852b,
        #003d16
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: appear 1.5s ease;
}

.logo span {
    color: #00e64d;
    -webkit-text-fill-color: #00e64d;
}

/* Curved arrow */
.arrow {
    width: 100%;
    max-width: 600px;
    height: 65px;
    margin: -5px auto 0;
}

.arrow path {
    fill: none;
    stroke: #008f32;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 800;
    stroke-dashoffset: 800;
    animation: draw 2s 0.5s forwards;
}

.tagline {
    color: #08752c;
    font-size: 13px;
    letter-spacing: 5px;
    margin-top: 10px;
    font-weight: bold;
    animation: appear 2s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes draw {
    to {
        stroke-dashoffset: 0;
    }
}

</style>
</head>

<body>

<div class="banner">

    <div class="wave-left"></div>
    <div class="wave-right"></div>
    <div class="wave-bottom"></div>

    <div class="logo-container">

        <div class="logo">
            VIRTOSIX<span>.</span>
        </div>

        <svg class="arrow" viewBox="0 0 600 80">
            <path d="M20 15 C100 95, 380 95, 560 20"/>
            <path d="M530 8 L565 20 L540 45"
                  stroke="#008f32"
                  stroke-width="7"
                  fill="none"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
        </svg>

        <div class="tagline">
            INNOVATE • OPTIMIZE • TRANSFORM
        </div>

    </div>

</div>

</body>
</html>
